<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/styles_cad.css">
    <script src="../js/cadastrarCarga.js"defer></script>
    <title>Cadastrar Carga</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;
        </nav>
    </header>
    <main>
        <h1>Cadastrar Carga</h1><br><br>
        <form>

        <label for="descricao">Descrição</label><br>
        <input type="text" id="descricao"><br><br>

        <label for="peso">Peso</label><br>
        <input type="number" step="any" id="peso"><br><br>

        <label for="volume">Volume</label><br>
        <input type="number" step="any" id="volume"><br><br>

        <label for="codRastreio">Código de Rastreio</label><br>
        <input type="text" id="codRastreio"><br><br>

        <label for="idMotorista">Código Motorista</label><br>
        <input type="text" id="idMotorista"><br><br>

        <button id="btn_cadCarga">Cadastrar</button>
        <div id="resposta"></div>

        </form>
    </main>
    
</body>
</html>
